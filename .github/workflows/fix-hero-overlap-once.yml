name: Fix landing hero overlap once

on:
  push:
    paths:
      - '.github/workflows/fix-hero-overlap-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Keep desktop artwork behind hero copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_copy = '.hero-copy>p{font-size:19px;line-height:1.65;color:#bac3d7;max-width:650px;margin:0 0 30px}'
          new_copy = '.hero-copy{position:relative;z-index:2}.hero-copy>p{font-size:19px;line-height:1.65;color:#bac3d7;max-width:650px;margin:0 0 30px}'
          old_stage = '.visual-stage{position:relative;min-height:610px}'
          new_stage = '.visual-stage{position:relative;z-index:1;min-height:610px}'
          if s.count(old_copy) != 1:
              raise SystemExit(f'Expected hero-copy target once, found {s.count(old_copy)}')
          if s.count(old_stage) != 1:
              raise SystemExit(f'Expected visual-stage target once, found {s.count(old_stage)}')
          s = s.replace(old_copy, new_copy, 1).replace(old_stage, new_stage, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix desktop hero artwork overlapping headline'
          git push origin HEAD:main
