name: Fix hero solid colors

on:
  push:
    paths:
      - '.github/workflows/fix-hero-solid-colors.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace fragile clipped gradient with direct colors
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'h1 .grad{background:linear-gradient(90deg,#fff 10%,#9feaff 50%,#ee80ff);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;-webkit-box-decoration-break:clone;box-decoration-break:clone}'
          new = 'h1 .grad{background:none;color:#49d9ff;-webkit-text-fill-color:#49d9ff}h1 .grad:last-child{color:#c05cff;-webkit-text-fill-color:#c05cff}'
          if old not in s:
              raise SystemExit('Expected current hero gradient CSS not found; refusing to modify.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Use reliable hero headline colors'
          git push
