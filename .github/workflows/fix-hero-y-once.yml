name: Fix desktop hero y clipping once

on:
  push:
    paths:
      - '.github/workflows/fix-hero-y-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix desktop hero headline clipping and stacking
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_h1 = 'h1{font-size:clamp(48px,6.15vw,84px);line-height:.98;letter-spacing:-.065em;margin:18px 0 26px;max-width:760px}'
          new_h1 = 'h1{font-size:clamp(48px,6.15vw,84px);line-height:1.04;letter-spacing:-.065em;margin:18px 0 26px;max-width:760px;padding-bottom:.06em}'
          old_copy = '.hero-copy{position:relative;z-index:2}'
          new_copy = '.hero-copy{position:relative;z-index:10}'
          old_stage = '.visual-stage{position:relative;z-index:1;min-height:610px}'
          new_stage = '.visual-stage{position:relative;z-index:0;min-height:610px}'
          for label, old in [('headline', old_h1), ('hero copy', old_copy), ('visual stage', old_stage)]:
              if s.count(old) != 1:
                  raise SystemExit(f'Expected {label} target once, found {s.count(old)}')
          s = s.replace(old_h1, new_h1, 1)
          s = s.replace(old_copy, new_copy, 1)
          s = s.replace(old_stage, new_stage, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix desktop hero headline clipping'
          git push origin HEAD:main
