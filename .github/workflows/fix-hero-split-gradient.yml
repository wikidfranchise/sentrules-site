name: Fix hero split gradient

on:
  push:
    paths:
      - '.github/workflows/fix-hero-split-gradient.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split wrapped gradient words
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<h1>Rules for the email <span class="grad">you send.</span></h1>'
          new = '<h1>Rules for the email <span class="grad">you</span> <span class="grad">send.</span></h1>'
          if old not in s:
              raise SystemExit('Expected hero headline not found; refusing to modify.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Split hero gradient words'
          git push
