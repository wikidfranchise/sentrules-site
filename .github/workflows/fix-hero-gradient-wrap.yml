name: Fix hero gradient wrap

on:
  push:
    paths:
      - '.github/workflows/fix-hero-gradient-wrap.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix wrapped inline gradient rendering
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'h1 .grad{background:linear-gradient(90deg,#fff 10%,#9feaff 50%,#ee80ff);-webkit-background-clip:text;background-clip:text;color:transparent}'
          new = 'h1 .grad{background:linear-gradient(90deg,#fff 10%,#9feaff 50%,#ee80ff);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;-webkit-box-decoration-break:clone;box-decoration-break:clone}'
          if old not in s:
              raise SystemExit('Expected hero gradient CSS not found; refusing to modify.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix wrapped hero gradient rendering'
          git push
